name: Bug Report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set KATO_ADAPTER=...
        2. Open the dashboard
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kato version / image tag
      placeholder: "e.g. v1.0.0 or ghcr.io/kwaadpepper/kato-dashboard:latest"
    validations:
      required: true

  - type: dropdown
    id: adapter
    attributes:
      label: Adapter in use
      options:
        - mock
        - uptimerobot
        - other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell
